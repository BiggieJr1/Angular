<div
  class="fixed inset-0 z-[60] flex items-center justify-center bg-black/50 p-4"
  role="dialog"
  aria-modal="true"
  aria-labelledby="titulo-invitar"
  (click)="cerrar.emit()"
>
  <div class="relative w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl" (click)="$event.stopPropagation()">
    <button
      type="button"
      (click)="cerrar.emit()"
      aria-label="Cerrar"
      class="absolute top-4 right-4 text-gray-400 hover:text-slate-800 transition-colors"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>

    <h2 id="titulo-invitar" class="text-xl font-bold text-slate-900 mb-1">Invitar a un amigo</h2>
    <p class="text-sm text-gray-600 mb-5">
      Comparte este enlace. Quien lo abra podrá aceptar tu solicitud de amistad.
    </p>

    @if (cargando()) {
      <div class="h-11 rounded-lg bg-gray-100 animate-pulse"></div>
    } @else if (enlace()) {
      <div class="flex gap-2">
        <input
          readonly
          [value]="enlace()"
          (focus)="$any($event.target).select()"
          aria-label="Enlace de invitación"
          class="min-w-0 flex-1 px-3 py-2 border border-gray-300 rounded-lg bg-gray-50 text-sm text-gray-700 outline-none focus:ring-2 focus:ring-slate-900"
        >
        <button
          type="button"
          (click)="copiar()"
          class="shrink-0 px-4 py-2 rounded-lg text-sm font-bold text-white bg-slate-900 hover:bg-slate-800 transition-colors"
        >
          {{ copiado() ? '¡Copiado!' : 'Copiar' }}
        </button>
      </div>
      <p class="mt-3 text-xs text-gray-500">Es de un solo uso y vence en 24 horas.</p>
    }

    @if (error()) {
      <div role="alert" class="mt-4 bg-red-100 border-l-4 border-red-500 text-red-700 p-3 rounded text-sm font-medium">
        {{ error() }}
      </div>
    }

    <div class="mt-5 flex items-center justify-between">
      <button
        type="button"
        (click)="generar()"
        [disabled]="cargando()"
        class="text-sm font-semibold text-blue-600 hover:text-blue-700 disabled:opacity-50"
      >
        Generar otro enlace
      </button>
      <button
        type="button"
        (click)="cerrar.emit()"
        class="px-4 py-2 rounded-lg text-sm font-semibold text-slate-700 hover:bg-gray-100 transition-colors"
      >
        Cerrar
      </button>
    </div>
  </div>
</div>
