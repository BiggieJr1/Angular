<article
  class="h-full bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md hover:-translate-y-1 transition-all duration-300 flex flex-col"
>
  <div
    class="h-40 bg-gradient-to-r {{
      curso().gradienteBg
    }} flex items-center justify-center overflow-hidden"
  >
    @if (curso().imagenUrl) {
      <img [src]="curso().imagenUrl" [alt]="curso().categoria" class="w-full h-full object-cover" />
    } @else {
      <span class="text-white font-sans text-xl opacity-80">{{ curso().categoria }}</span>
    }
  </div>

  <div class="p-5 flex-1 flex flex-col">
    <div class="flex items-center justify-between mb-2">
      <span class="px-2.5 py-0.5 rounded-full text-xs font-medium {{ curso().badgeColor }}">
        {{ curso().categoria }}
      </span>
      <span class="text-sm font-sans text-gray-500">{{ curso().duracion }}</span>
    </div>

    <h3 class="text-lg font-sans text-slate-800 mb-2 leading-tight">{{ curso().titulo }}</h3>

    <p class="text-sm text-gray-600 mb-4 flex-1">{{ curso().descripcion }}</p>

    <a
      [routerLink]="['/curso', curso().id]"
      class="block w-full text-center bg-slate-900 hover:bg-slate-800 text-white font-sans py-2 px-4 rounded-lg transition-colors"
    >
      Ver detalles
    </a>
  </div>
</article>
