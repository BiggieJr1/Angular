<div class="max-w-8xl mx-auto px-0 sm:px-0 lg:px-8 py-4">
  <div class="mb-10 text-center md:text-left">
    <selector-categorias
      class="block mb-10"
      [categorias]="categorias"
      [seleccionada]="categoriaSeleccionada()"
      [conteos]="conteoPorCategoria()"
      (seleccionar)="alternarCategoria($event)"
    />

    <h1 class="text-3xl font-sans text-slate-900 sm:text-4xl">Catálogo de Cursos</h1>
    <p class="mt-3 text-lg text-gray-500">
      Impulsa tu carrera dominando las tecnologías más demandadas en el entorno de desarrollo y
      sistemas.
    </p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
    @for (curso of cursosFiltrados(); track curso.id) {
      <curso-card [curso]="curso" />
    } @empty {
      <empty-state class="col-span-full" mensaje="No hay cursos disponibles en este momento." />
    }
  </div>
</div>
