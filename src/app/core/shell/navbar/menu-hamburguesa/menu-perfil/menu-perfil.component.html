<section class="flex flex-col items-center gap-1 border-b border-gray-200 px-5 py-4 text-center">
  <div class="flex h-20 w-20 items-center justify-center rounded-full border-2 border-gray-300 bg-white text-2xl font-semibold text-slate-800" aria-hidden="true">
    {{ iniciales() }}
  </div>

  <p class="mt-2 max-w-full truncate text-lg font-semibold text-slate-800">{{ nombre() }}</p>
  <span class="rounded-full bg-gray-100 px-2.5 py-0.5 text-xs font-medium text-gray-600">{{ rol() }}</span>

  <button
    routerLink="/mi-perfil"
    type="button"
    class="mt-3 rounded-md border-gray-300 bg-gray-100 px-4 py-1.5 text-sm text-gray-700 hover:bg-gray-200 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-900"
  >
    Ver perfil
  </button>
</section>
