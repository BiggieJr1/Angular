<div class="flex items-center space-x-3">
  <button (click)="abrirModal()" class="text-sm font-medium text-gray-600 hover:text-slate-900 px-3 py-2 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-gray-200">
    Iniciar sesión
  </button>

  <button (click)="abrirModal()" class="text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg shadow-sm transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
    Registrarse
  </button>
</div>

@if (isModalOpen) {
  <div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md relative">
      
      <button (click)="cerrarModal()" class="absolute top-4 right-4 text-gray-400 hover:text-slate-800 transition-colors focus:outline-none">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <div class="p-8">
        <h2 class="text-2xl font-bold text-slate-900 text-center mb-6">Accede a tu cuenta</h2>
        
        <form class="space-y-5">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
            <input type="email" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors" placeholder="tu@correo.com">
          </div>
          
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
            <input type="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors" placeholder="••••••••">
          </div>

          <div class="flex items-center justify-between text-sm">
            <label class="flex items-center text-gray-600 cursor-pointer">
              <input type="checkbox" class="mr-2 rounded border-gray-300 text-blue-600 focus:ring-blue-500"> Recordarme
            </label>
            <a href="#" class="text-blue-600 hover:text-blue-700 font-medium">¿Olvidaste tu contraseña?</a>
          </div>

          <button type="button" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-2.5 rounded-lg transition-colors mt-2">
            Entrar al catálogo
          </button>
        </form>
        
        <p class="text-center text-sm text-gray-600 mt-6">
          ¿No tienes una cuenta? <a href="#" class="text-blue-600 hover:text-blue-700 font-medium">Regístrate aquí</a>
        </p>
      </div>
    </div>
  </div>
}
